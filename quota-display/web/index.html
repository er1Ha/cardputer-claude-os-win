<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude / Codex Usage Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f7f7f5;
    --ink:       #111;
    --muted:     #888;
    --card-bg:   #0a0a0a;
    --card-mute: #5a5a5a;
    --card-line: #1c1c1c;
    --bar-bg:    #1f1f1f;
    --claude:    #cc785c;
    --codex:     #f0eee6;
    --green:     #2eb872;
    --red:       #d85a5a;
    --shadow:    0 18px 48px rgba(0,0,0,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
               font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                            sans-serif;
               -webkit-font-smoothing: antialiased; }

  .page { max-width: 720px; margin: 0 auto; padding: 56px 24px 40px; }

  /* ---- top step row ---- */
  .step { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .step .num {
    width: 26px; height: 26px; border-radius: 999px;
    background: var(--green); color: white;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }
  .step .title { font-size: 17px; font-weight: 600; }
  .step .live  { margin-left: auto; font-size: 13px; color: var(--muted); }
  .step .live::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    border-radius: 999px; background: var(--green);
    margin-right: 6px; vertical-align: middle;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* ---- the dark card (mirrors the device LCD) ---- */
  .card {
    background: var(--card-bg);
    color: white;
    border-radius: 22px;
    padding: 22px 26px 24px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .card.codex { --accent: var(--codex); }
  .card { --accent: var(--claude); }

  .card-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 6px;
           font-size: 12px; letter-spacing: 2.4px; color: var(--accent);
           font-weight: 700; }
  .brand .logo { width: 14px; height: 14px; display: grid; place-items: center; }
  .brand .logo svg { width: 100%; height: 100%; display: block; }
  .card-title {
    text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -0.01em;
  }
  .batt {
    justify-self: end;
    position: relative;
    width: 24px; height: 12px; border-radius: 2px;
    border: 1.5px solid rgba(255,255,255,0.55);
  }
  .batt::after {
    content: ""; position: absolute; right: -3px; top: 3px;
    width: 2px; height: 4px; border-radius: 1px;
    background: rgba(255,255,255,0.55);
  }
  .batt > i { display: block; height: 100%; width: 92%; background: white; border-radius: 1px; }

  /* ---- the two big rows ---- */
  .row { margin-top: 4px; }
  .row + .row { margin-top: 26px; }
  .row-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
  }
  .row-num {
    font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
  }
  .row-num .pct { font-size: 22px; font-weight: 600; color: var(--card-mute);
                  margin-left: 2px; vertical-align: 16px; }
  .row-label { font-size: 12px; letter-spacing: 3px; color: var(--card-mute);
               font-weight: 600; }
  .bar { height: 4px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent);
             width: 0%; transition: width 0.5s ease; border-radius: 999px; }

  /* ---- card footer ---- */
  .card-foot {
    margin-top: 22px;
    text-align: center;
    font-size: 13px; color: var(--accent);
    letter-spacing: 0.04em;
  }
  .card-foot.muted { color: var(--card-mute); }

  /* ---- subtitle ---- */
  .mirror-note { text-align: center; margin: 18px 0 0;
                 font-size: 14px; color: var(--muted); }

  /* ---- bottom connect bar ---- */
  .connect {
    display: flex; align-items: center; gap: 10px;
    margin-top: 28px; padding: 14px 18px;
    background: white; border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }
  .connect .dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--green);
    box-shadow: 0 0 0 4px rgba(46,184,114,0.16);
  }
  .connect .dot.bad { background: var(--red);
                      box-shadow: 0 0 0 4px rgba(216,90,90,0.16); }
  .connect .name { font-size: 14px; font-weight: 500; }
  .connect .sep  { color: var(--muted); }
  .connect .right { margin-left: auto; display: flex; gap: 18px; }
  .connect button {
    border: 0; background: transparent; color: var(--ink);
    cursor: pointer; font: inherit; font-size: 14px;
    padding: 4px 2px;
  }
  .connect button:hover { color: var(--claude); }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 6px; justify-content: center;
          margin: 6px 0 22px; }
  .tab {
    background: transparent; color: var(--muted);
    border: 0; padding: 6px 14px; border-radius: 999px;
    font: inherit; font-size: 13px; letter-spacing: 1.6px;
    font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--ink); color: white; }

  /* ---- footer note ---- */
  .footnote {
    margin-top: 18px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .footnote a, .footnote button {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 12px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="step">
    <div class="num">3</div>
    <div class="title">实时同步</div>
    <div class="live">实时同步中</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-target="claude">CLAUDE</button>
    <button class="tab" data-target="codex">CODEX</button>
  </div>

  <!-- CLAUDE card -->
  <div class="card claude" data-screen="claude">
    <div class="card-head">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.5 18.5l5-2.6.1-.2-.1-.1h-.2l-.8-.05-2.7-.07-2.3-.1-2.3-.12-.6-.13L0 14.6l.05-.35.5-.32.7.06 1.5.1 2.3.16 1.6.1 2.4.25h.4l.05-.15-.13-.1-.1-.1-2.3-1.6-2.5-1.7-1.3-1-.7-.5-.4-.45-.15-1 .65-.7.9.05.2.06.9.7 1.9 1.45 2.5 1.85.36.3.15-.1v-.07l-.16-.27-1.35-2.45-1.45-2.6-.65-1-.16-.6c-.06-.24-.1-.46-.1-.74L4.95 1.2l.4-.2 1 .14.4.36.6 1.4 1 2.22 1.55 3 .45.9.25.85.1.25h.15v-.15l.12-1.7.23-2.1.22-2.7.07-.75.4-.92.75-.5.6.3.5.7-.06.45-.3 1.86L11.92 6l-.4 1.95h.2l.25-.25 1-1.3 1.65-2.07.75-.82.85-.9.55-.43h1.04l.77 1.13-.35 1.17-1.07 1.35-.9 1.14-1.27 1.7-.8 1.36.07.1.18-.02 2.85-.6 1.55-.3 1.85-.32.85.4.1.4-.34.8-1.97.5-2.3.45-3.45.82h-.04l.05.06 1.55.14.65.04h1.6l3.05.22.8.52.5.65-.07.5-1.22.6-1.65-.4-3.85-.9-1.3-.32h-.2v.1l1.1 1.07 2 1.8 2.5 2.34.13.6-.33.45-.34-.05-2.2-1.66-.85-.75-1.95-1.6h-.13v.16l.45.65 2.35 3.5.12 1.08-.17.36-.6.2-.67-.12-1.4-1.9-1.42-2.18-1.14-1.95-.14.08-.68 7.3-.32.4-.74.28-.6-.45-.32-.75.32-1.5.4-1.92.32-1.53.3-1.92.16-.62v-.04h-.13l-1.45 1.95-2.2 2.95-1.74 1.85-.42.16-.7-.36.06-.66.4-.6 2.4-3.05 1.5-1.9.93-1.1v-.16h-.06L7 14.65l-1.14.15-.5-.46.06-.75.23-.25 1.9-1.3z" fill="#cc785c"/>
          </svg>
        </span>CLAUDE
      </div>
      <div class="card-title">Usage</div>
      <div class="batt"><i></i></div>
    </div>

    <div class="row">
      <div class="row-head">
        <div class="row-num" data-num="5h">0<span class="pct">%</span></div>
        <div class="row-label">CURRENT</div>
      </div>
      <div class="bar"><i data-bar="5h"></i></div>
    </div>

    <div class="row">
      <div class="row-head">
        <div class="row-num" data-num="7d">0<span class="pct">%</span></div>
        <div class="row-label">WEEKLY</div>
      </div>
      <div class="bar"><i data-bar="7d"></i></div>
    </div>

    <div class="card-foot muted" data-foot>Determining…</div>
  </div>

  <!-- CODEX card -->
  <div class="card codex" data-screen="codex" hidden>
    <div class="card-head">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.1 10.2c-.06-.08-.08-.14-.05-.23.24-.76.3-1.53.17-2.32a5.16 5.16 0 0 0-1.95-3.33c-1.25-.99-2.69-1.34-4.28-1.08-.15.02-.24-.02-.34-.12a4.99 4.99 0 0 0-4.86-1.5C7.81 2 6.46 3.18 5.74 5.05a.3.3 0 0 1-.18.16 4.99 4.99 0 0 0-3 1.9 5.2 5.2 0 0 0-1.03 4.25c.2.92.6 1.74 1.18 2.41.08.1.1.18.06.29-.16.48-.22.98-.23 1.5.02.37.04.75.13 1.13.64 2.78 3.39 4.58 6.23 4.06.11-.02.17 0 .24.08a4.94 4.94 0 0 0 4.91 1.55c1.98-.38 3.33-1.57 4.05-3.44.03-.08.07-.12.16-.14a5.07 5.07 0 0 0 4.12-4.68c.14-1.47-.3-2.78-1.27-3.92zM6.88 6.9c0-1.98 1.28-3.57 3.25-3.96 1.2-.23 2.31.07 3.31.85l-1.62.92c-.9.51-1.79 1.02-2.7 1.53a.75.75 0 0 0-.41.71v5.54c-.06.02-.1-.03-.14-.05L7 11.55c-.1-.06-.14-.13-.14-.25v-4.4zm-4 3.83c-.2-1.7.88-3.45 2.5-4.04l.09-.02v4.6c0 .35.14.6.45.78 1.57.88 3.13 1.78 4.7 2.66l.15.1-1.73 1c-.06.03-.1.05-.18 0a51.21 51.21 0 0 0-4.2-2.42 3.6 3.6 0 0 1-1.78-2.66zm1.75 6.97c-.86-1.31-1.1-2.78-.6-4.32l.27.15c1.34.76 2.67 1.52 4 2.28a.8.8 0 0 0 .86 0c1.59-.9 3.17-1.81 4.76-2.71l.12-.07c0 .68 0 1.34.01 2 0 .08-.04.11-.1.15a37.7 37.7 0 0 1-4.13 2.33c-1.81.97-4.08.42-5.2-1.28zm12.43-.28a3.93 3.93 0 0 1-2.52 3.42 4.04 4.04 0 0 1-4-.66l1.88-1.07c.8-.46 1.6-.92 2.41-1.37.4-.22.6-.55.6-1.01-.01-1.8 0-3.6 0-5.4v-.1c.51.3 1.03.6 1.55.88.08.05.12.1.12.2v4.8z" fill="#111"/>
          </svg>
        </span>CODEX
      </div>
      <div class="card-title">Usage</div>
      <div class="batt"><i></i></div>
    </div>

    <div class="row">
      <div class="row-head">
        <div class="row-num" data-num="5h">0<span class="pct">%</span></div>
        <div class="row-label">CURRENT</div>
      </div>
      <div class="bar"><i data-bar="5h"></i></div>
    </div>

    <div class="row">
      <div class="row-head">
        <div class="row-num" data-num="7d">0<span class="pct">%</span></div>
        <div class="row-label">WEEKLY</div>
      </div>
      <div class="bar"><i data-bar="7d"></i></div>
    </div>

    <div class="card-foot muted" data-foot>Determining…</div>
  </div>

  <div class="mirror-note">正在显示在 Cardputer 屏幕上</div>

  <div class="connect">
    <span class="dot" id="status-dot"></span>
    <span class="name" id="status-name">Cardputer-Quota</span>
    <span class="sep">·</span>
    <span class="name" id="status-state">已连接</span>
    <div class="right">
      <button id="refresh-btn">刷新</button>
      <button id="disconnect-btn">隐藏</button>
    </div>
  </div>

  <div class="footnote">
    <span>本地运行 · 额度数据只在这台电脑和 Cardputer 之间传输</span>
    <button id="reset-btn">重置流程</button>
  </div>

</div>

<script>
  const POLL_INTERVAL_MS = 5000;
  const tabs = document.querySelectorAll(".tab");
  const screens = document.querySelectorAll("[data-screen]");
  function show(target) {
    tabs.forEach(t => t.classList.toggle("active", t.dataset.target === target));
    screens.forEach(s => {
      const on = s.dataset.screen === target;
      s.hidden = !on;
    });
  }
  tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.target)));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "Tab" || e.key === "d" || e.key === "D") {
      e.preventDefault(); show("codex");
    }
    if (e.key === "ArrowLeft"  || e.key === "a" || e.key === "A") {
      e.preventDefault(); show("claude");
    }
  });

  function fmtReset(sec) {
    if (!sec) return "Determining…";
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h >= 24) {
      const d = Math.floor(h / 24);
      return `Resets in ${d}d ${h % 24}h`;
    }
    if (h) return `Resets in ${h}h ${m}m`;
    return `Resets in ${m}m`;
  }

  function setRow(screen, key, w) {
    const card = document.querySelector(`.card[data-screen="${screen}"]`);
    if (!card) return;
    const pct = Math.max(0, Math.min(100, Math.round(w.pct || 0)));
    const num = card.querySelector(`[data-num="${key}"]`);
    const bar = card.querySelector(`[data-bar="${key}"]`);
    if (num) num.firstChild.nodeValue = String(pct);
    if (bar) bar.style.width = pct + "%";
  }

  function setFoot(screen, text, muted) {
    const card = document.querySelector(`.card[data-screen="${screen}"]`);
    if (!card) return;
    const foot = card.querySelector("[data-foot]");
    if (!foot) return;
    foot.textContent = text;
    foot.classList.toggle("muted", !!muted);
  }

  let lastPayload = "";
  function setOnline(on, label) {
    const dot = document.getElementById("status-dot");
    const state = document.getElementById("status-state");
    dot.classList.toggle("bad", !on);
    state.textContent = label || (on ? "已连接" : "断开");
  }

  async function tick() {
    try {
      const r = await fetch("/api/quota", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      const next = JSON.stringify(data);
      if (next === lastPayload) { setOnline(true); return; }
      lastPayload = next;

      for (const screen of ["claude", "codex"]) {
        const blk = data[screen] || {};
        const w5 = blk["5h"] || {}, w7 = blk["7d"] || {};
        setRow(screen, "5h", w5);
        setRow(screen, "7d", w7);

        const card = document.querySelector(`.card[data-screen="${screen}"]`);
        if (card) {
          const titleEl = card.querySelector(".card-title");
          if (blk.plan) titleEl.textContent = `Usage · ${blk.plan}`;
          else titleEl.textContent = "Usage";
        }

        // Foot text: prefer the more pressing window's reset.
        const primary = (w5.reset_s || 0) <= (w7.reset_s || 0) ? w5 : w7;
        const tag = primary === w5 ? "5h" : "7d";
        let foot;
        if (w5.source === "rolled_over" && w7.source === "rolled_over") {
          foot = "Both windows just reset · 0% used";
        } else if (primary.source === "rolled_over") {
          foot = `${tag} window reset · waiting on next sample`;
        } else if (primary.reset_s) {
          foot = `${tag.toUpperCase()} · ${fmtReset(primary.reset_s)}`;
        } else {
          foot = "Determining…";
        }
        setFoot(screen, foot, !primary.reset_s);
      }
      setOnline(true);
    } catch (e) {
      setOnline(false, "未连接");
    }
  }

  document.getElementById("refresh-btn").addEventListener("click", () => {
    lastPayload = ""; tick();
  });
  document.getElementById("disconnect-btn").addEventListener("click", () => {
    document.querySelectorAll(".card").forEach(c => c.hidden = true);
    setOnline(false, "已隐藏");
  });
  document.getElementById("reset-btn").addEventListener("click", () => location.reload());

  tick();
  setInterval(tick, POLL_INTERVAL_MS);
</script>
</body>
</html>
