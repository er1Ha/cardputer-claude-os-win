<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cardputer Usage — LIVE (240x135)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:   #f0eee6;
    --orange:  #cc785c;
    --black:   #000;
    --gray-mid:#666;
    --bar-bg:  #d9d6cc;
    --pixel:     "Silkscreen", "Press Start 2P", ui-monospace, monospace;
    --pixel-big: "Press Start 2P", "Silkscreen", ui-monospace, monospace;
  }
  html, body {
    margin: 0;
    background: #111;
    color: var(--cream);
    font-family: var(--pixel);
    -webkit-font-smoothing: none;
    font-smooth: never;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    box-sizing: border-box;
  }

  .tabs { display: flex; gap: 6px; }
  .tab {
    background: #1d1d1d;
    color: var(--cream);
    border: 1px solid #333;
    padding: 6px 14px;
    font: 12px/1 var(--pixel);
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
  }
  .tab.active { background: var(--orange); color: #000; border-color: var(--orange); }

  .frame {
    background: #000;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #333;
    width: calc(240px * 3);
    height: calc(135px * 3);
    box-sizing: content-box;
  }
  .lcd {
    width: 240px;
    height: 135px;
    background: var(--cream);
    color: var(--black);
    overflow: hidden;
    transform: scale(3);
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    image-rendering: pixelated;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  .lcd .head {
    display: grid;
    grid-template-columns: 14px 1fr 18px;
    align-items: center;
    gap: 4px;
    padding: 3px 6px 2px;
    height: 14px;
    flex: 0 0 auto;
  }
  .lcd .title {
    text-align: center;
    font: 7px/1 var(--pixel);
    letter-spacing: 2px;
  }
  .lcd .logo { width: 14px; height: 14px; display: grid; place-items: center; }
  .lcd .logo svg { width: 100%; height: 100%; display: block; }

  .lcd .batt {
    position: relative;
    width: 16px;
    height: 8px;
    border: 1px solid var(--black);
    border-radius: 1px;
    justify-self: end;
  }
  .lcd .batt::after {
    content: "";
    position: absolute;
    right: -2px;
    top: 2px;
    width: 1px;
    height: 3px;
    background: var(--black);
  }
  .lcd .batt > i {
    display: block;
    height: 100%;
    width: 90%;
    background: var(--black);
  }

  .lcd .body {
    flex: 1 1 auto;
    padding: 0 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }
  .lcd .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1px;
  }
  .lcd .row-label {
    font: 9px/1 var(--pixel-big);
    letter-spacing: 0.5px;
  }
  .lcd .row-pct {
    font: 6px/1 var(--pixel);
    letter-spacing: 1px;
  }
  .lcd .bar {
    height: 4px;
    background: var(--bar-bg);
    overflow: hidden;
    margin: 2px 0 2px;
  }
  .lcd .bar > i { display: block; height: 100%; background: var(--orange); transition: width 0.4s ease; }
  .lcd.codex .bar > i { background: var(--black); }
  .lcd .foot {
    font: 6px/1 var(--pixel);
    letter-spacing: 0.3px;
    color: var(--gray-mid);
  }

  .meta {
    font: 11px/1 ui-monospace, monospace;
    color: #888;
    letter-spacing: 1px;
    min-height: 12px;
    text-align: center;
  }
  #status {
    display: inline-block;
    min-width: 520px;
    text-align: left;
    vertical-align: top;
  }

  .chat {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    z-index: 10;
  }
  .chat.open { display: flex; }
  .chat-panel {
    width: min(720px, calc(100vw - 32px));
    background: #000;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    box-sizing: border-box;
  }
  .chat-lcd {
    background: var(--cream);
    color: #000;
    min-height: 300px;
    padding: 14px;
    box-sizing: border-box;
    font: 13px/1.55 var(--pixel);
    letter-spacing: 0.5px;
  }
  .chat-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .chat-title { color: var(--orange); }
  .chat-close {
    border: 0;
    background: #000;
    color: var(--cream);
    font: 11px/1 var(--pixel);
    padding: 5px 8px;
    cursor: pointer;
  }
  .chat-log {
    height: 176px;
    overflow: auto;
    white-space: pre-wrap;
    background: rgba(0, 0, 0, 0.06);
    padding: 8px;
    box-sizing: border-box;
  }
  .chat-settings {
    display: none;
    grid-template-columns: 120px 1fr;
    gap: 7px 8px;
    margin-bottom: 10px;
    padding: 8px;
    background: rgba(0, 0, 0, 0.08);
    box-sizing: border-box;
  }
  .chat-settings.open { display: grid; }
  .chat-settings label {
    align-self: center;
    color: #333;
    font: 10px/1 var(--pixel);
  }
  .chat-settings input {
    min-width: 0;
    border: 1px solid #999;
    background: #fff;
    color: #000;
    padding: 6px;
    font: 12px/1.2 ui-monospace, monospace;
  }
  .chat-settings-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .chat-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .chat-input {
    flex: 1;
    min-width: 0;
    border: 1px solid #999;
    background: #fff;
    color: #000;
    padding: 8px;
    font: 13px/1.2 ui-monospace, monospace;
  }
  .chat-send {
    border: 0;
    background: var(--orange);
    color: #000;
    padding: 8px 12px;
    font: 11px/1 var(--pixel);
    cursor: pointer;
  }
  .chat-ghost {
    border: 1px solid #999;
    background: transparent;
    color: #000;
    padding: 7px 10px;
    font: 10px/1 var(--pixel);
    cursor: pointer;
  }
</style>

  const $chatSettings = document.getElementById('chatSettings');
  const $chatWorkerBase = document.getElementById('chatWorkerBase');

  const $chatApiBase = document.getElementById('chatApiBase');
  const $chatApiKey = document.getElementById('chatApiKey');
  const $chatModel = document.getElementById('chatModel');
  const $chatSaveSettings = document.getElementById('chatSaveSettings');
  const $chatTestSettings = document.getElementById('chatTestSettings');
  const $chatLog = document.getElementById('chatLog');
  const $chatForm = document.getElementById('chatForm');
  const $chatInput = document.getElementById('chatInput');
  function show(target) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === target));
    screens.forEach(s => s.classList.toggle('active', s.dataset.screen === target));
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.target)));
  document.addEventListener('keydown', e => {
    const isTyping = e.target && ["INPUT", "TEXTAREA"].includes(e.target.tagName);
    if ($chat.classList.contains('open') && isTyping) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeChat();
      }
      return;
    }
    if ((e.key === 'y' || e.key === 'Y') && !$chat.classList.contains('open')) {
      e.preventDefault();
      openChat();
      return;
    }
    if ((e.key === 'Escape' || e.key === 'q' || e.key === 'Q') && $chat.classList.contains('open')) {
      e.preventDefault();
      closeChat();
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'd' || e.key === 'D' || e.key === 'Tab') {
      e.preventDefault(); show('codex');
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'a' || e.key === 'A') {
      e.preventDefault(); show('claude');
    }
  });

  function openChat() {
    $chat.classList.add('open');
    syncSettingsInputs();
    $chatInput.focus();
    $chatInput.select();
  }

  function closeChat() {
    $chat.classList.remove('open');
  }

  function appendChat(who, text) {
    const current = $chatLog.textContent === 'Press Y to chat. Enter sends.' ? '' : $chatLog.textContent + '\n\n';
    $chatLog.textContent = current + `${who}: ${text}`;
    $chatLog.scrollTop = $chatLog.scrollHeight;
  }

  function getChatSettings() {
    try {
      return { ...CHAT_DEFAULTS, ...(JSON.parse(localStorage.getItem(CHAT_SETTINGS_KEY) || '{}')) };
    } catch {
      return { ...CHAT_DEFAULTS };
    }
  }

  function setChatSettings(next) {
    const current = getChatSettings();
    const merged = { ...current, ...next };
    localStorage.setItem(CHAT_SETTINGS_KEY, JSON.stringify(merged));
    return merged;
  }

  function syncSettingsInputs() {
    const s = getChatSettings();
    $chatWorkerBase.value = s.workerBase || '';
    $chatDeviceSecret.value = s.deviceSecret || '';
    $chatApiBase.value = s.apiBase || '';
    $chatApiKey.value = s.apiKey || '';
    $chatModel.value = s.model || '';
  }

  function saveSettingsFromInputs() {
    let workerBase = $chatWorkerBase.value.trim();
    let apiBase = $chatApiBase.value.trim();
    if (workerBase.includes('xiaomimimo.com')) {
      apiBase = workerBase;
      workerBase = CHAT_DEFAULTS.workerBase;
    }
    return setChatSettings({
      workerBase,
      deviceSecret: $chatDeviceSecret.value.trim(),
      apiBase,
      apiKey: $chatApiKey.value.trim(),
      model: $chatModel.value.trim(),
    });
  }

  async function callChat(prompt) {
    const s = getChatSettings();
    const headers = {
      'content-type': 'application/json',
      'x-device-secret': s.deviceSecret,
    };
    if (s.apiKey) headers['x-chat-api-key'] = s.apiKey;
    if (s.apiBase) headers['x-chat-base-url'] = s.apiBase;
    const r = await fetch((s.workerBase || '').replace(/\/+$/, '') + '/ask-text', {
      method: 'POST',
      headers,
      body: JSON.stringify({ prompt, model: s.model }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error || `HTTP ${r.status}`);
    return data.response || '(empty)';
  }

  $chatClose.addEventListener('click', closeChat);
  $chatSettingsToggle.addEventListener('click', () => {
    $chatSettings.classList.toggle('open');
    syncSettingsInputs();
  });
  $chatSaveSettings.addEventListener('click', () => {
    saveSettingsFromInputs();
    appendChat('SET', 'saved');
  });
  $chatTestSettings.addEventListener('click', async () => {
    saveSettingsFromInputs();
    appendChat('SET', 'testing...');
    try {
      const text = await callChat('Reply with OK only.');
      appendChat('AI', text);
    } catch (err) {
      appendChat('ERR', err.message);
    }
  });
  $chat.addEventListener('click', e => {
    if (e.target === $chat) closeChat();
  });
  $chatForm.addEventListener('submit', async e => {
    e.preventDefault();
    const prompt = $chatInput.value.trim();
    if (!prompt) return;
    $chatInput.value = '';
    appendChat('YOU', prompt);
    appendChat('AI', '...');
    try {
      const text = await callChat(prompt);
      $chatLog.textContent = $chatLog.textContent.replace(/\n\nAI: \.\.\.$/, `\n\nAI: ${text}`);
      $chatLog.scrollTop = $chatLog.scrollHeight;
    } catch (err) {
      $chatLog.textContent = $chatLog.textContent.replace(/\n\nAI: \.\.\.$/, `\n\nAI: ${err.message}. Check SET: Worker relay must be workers.dev, Mimo base is xiaomimimo.com/v1.`);
    }
  });

  // ---- live data ------------------------------------------------------
  const POLL_INTERVAL_MS = 5000;
  let lastPayload = '';
  const $status = document.getElementById('status');

  function fmtReset(sec) {
    if (!sec) return '--';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h >= 24) return `IN ${Math.floor(h / 24)}D ${h % 24}H`;
    if (h) return `IN ${h} HR ${m} MIN`;
    return `IN ${m} MIN`;
  }

  function setRow(screen, win, w) {
    const root = document.querySelector(`.screen[data-screen="${screen}"]`);
    if (!root) return;
    const rows = root.querySelectorAll('.row');
    const row = win === '5h' ? rows[0] : rows[1];
    if (!row) return;
    const pct = Math.max(0, Math.min(100, Math.round(w.pct || 0)));
    const pctEl  = row.querySelector('.row-pct');
    const barEl  = row.querySelector('.bar > i');
    const footEl = row.querySelector('.foot');
    const pctText = `${pct}% USED`;
    const barWidth = `${pct}%`;
    let footText = `RESETS ${fmtReset(w.reset_s)}`;
    if (w.source === 'rolled_over') footText = 'WINDOW RESET';
    if (pctEl.textContent !== pctText) pctEl.textContent = pctText;
    if (barEl.style.width !== barWidth) barEl.style.width = barWidth;
    if (footEl.textContent !== footText) footEl.textContent = footText;
  }

  function setTitle(screen, plan) {
    const root = document.querySelector(`.screen[data-screen="${screen}"]`);
    if (!root) return;
    const titleEl = root.querySelector('.title');
    const base = screen.toUpperCase();
    titleEl.textContent = plan ? `${base} ${plan.toUpperCase()}` : base;
  }

  function accountLabel(account) {
    if (!account) return '';
    return account.email || account.type || '';
  }

  async function refresh() {
    try {
      const r = await fetch('/api/quota');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const next = JSON.stringify(data);
      if (next === lastPayload) return;
      lastPayload = next;
      for (const screen of ['claude', 'codex']) {
        const blk = data[screen] || {};
        setTitle(screen, blk.plan || '');
        setRow(screen, '5h', blk['5h'] || {});
        setRow(screen, '7d', blk['7d'] || {});
      }
      const cs = data.claude || {};
      const xs = data.codex || {};
      const csrc = [cs['5h']?.source, cs['7d']?.source].filter(Boolean).join('/') || 'unknown';
      const xsrc = [xs['5h']?.source, xs['7d']?.source].filter(Boolean).join('/') || 'unknown';
      const codexAccount = accountLabel(xs.account);
      $status.textContent =
        `updated ${new Date((data.generated_at || Date.now()/1000) * 1000).toLocaleTimeString()}` +
        ` | claude ${csrc} | codex ${xsrc}` +
        (codexAccount ? ` | account ${codexAccount}` : '');
    } catch (e) {
      $status.textContent = 'error: ' + e.message;
    }
  }

  refresh();
  setInterval(refresh, POLL_INTERVAL_MS);
</script>
</body>
</html>
